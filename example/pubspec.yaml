name: zmedia_player_example
description: A comprehensive example app demonstrating ZMedia Player features.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  zmedia_player:
    path: ../
  cupertino_icons: ^1.0.2
  fluentui_system_icons: ^1.1.273
  # Only a transitive dependency of zmedia_player otherwise; declared
  # directly here because the Local File Playback page (C-02 Stage 1,
  # lib/pages/local_file_playback_page.dart) uses it directly to resolve
  # the app's documents directory.
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only a transitive dependency of zmedia_player otherwise; declared
  # directly here because the Stage 7a measurement widget tests
  # (test/pages/measurement/) drive VisibilityDetectorController directly.
  visibility_detector: ^0.4.0+2

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/images/
