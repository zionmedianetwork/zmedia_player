name: zmedia_player_example
description: A comprehensive example app demonstrating ZMedia Player features.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  zmedia_player:
    path: ../
  cupertino_icons: ^1.0.2
  fluentui_system_icons: ^1.1.273

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/images/
