name: flutter_media_player
description: A comprehensive Flutter media player package with advanced features for video and audio playback.
version: 0.1.0
homepage: https://github.com/your-org/flutter_media_player
repository: https://github.com/your-org/flutter_media_player

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_media_player
        pluginClass: FlutterMediaPlayerPlugin
      ios:
        pluginClass: FlutterMediaPlayerPlugin
