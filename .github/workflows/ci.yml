name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-analyze-test:
    name: Lint, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Check code formatting
        run: |
          echo "Checking Dart code formatting..."
          dart format --set-exit-if-changed lib/ test/
        continue-on-error: false

      - name: Analyze code
        run: |
          echo "Running Flutter analyze..."
          flutter analyze --fatal-infos --fatal-warnings
        continue-on-error: false

      - name: Run tests
        run: |
          echo "Running Flutter tests..."
          flutter test --coverage --reporter expanded
        continue-on-error: false

      - name: Check test coverage
        run: |
          echo "Checking test coverage..."
          if [ -f coverage/lcov.info ]; then
            echo "Coverage report generated successfully"
            # Install lcov for coverage reporting
            sudo apt-get update
            sudo apt-get install -y lcov
            # Generate coverage summary
            lcov --summary coverage/lcov.info
          else
            echo "Warning: No coverage report found"
          fi

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Optional: Run performance tests separately
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-analyze-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run performance tests
        run: |
          echo "Running performance tests..."
          flutter test test/performance/
        continue-on-error: false

  # Optional: Run memory tests separately
  memory-tests:
    name: Memory Leak Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-analyze-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run memory leak tests
        run: |
          echo "Running memory leak tests..."
          flutter test test/memory/
        continue-on-error: false

  # Summary job - all required checks must pass
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [lint-analyze-test, performance-tests, memory-tests]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.lint-analyze-test.result }}" != "success" ] || \
             [ "${{ needs.performance-tests.result }}" != "success" ] || \
             [ "${{ needs.memory-tests.result }}" != "success" ]; then
            echo "One or more CI jobs failed!"
            exit 1
          fi
          echo "All CI checks passed successfully!"
