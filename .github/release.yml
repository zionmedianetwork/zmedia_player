# GitHub Release Notes Configuration
# This configures how GitHub auto-generates release notes

changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
      - duplicate
      - invalid
      - wontfix

  categories:
    - title: 💥 Breaking Changes
      labels:
        - breaking-change
        - breaking

    - title: 🚀 Features
      labels:
        - feature
        - enhancement
        - feat

    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
        - bugfix

    - title: ⚡ Performance Improvements
      labels:
        - performance
        - perf
        - optimization

    - title: 📚 Documentation
      labels:
        - documentation
        - docs

    - title: 🔧 Refactoring
      labels:
        - refactor
        - refactoring
        - code-quality

    - title: ✅ Tests
      labels:
        - test
        - testing
        - tests

    - title: 🔨 Build & CI
      labels:
        - build
        - ci
        - github-actions

    - title: 📦 Dependencies
      labels:
        - dependencies
        - deps

    - title: Other Changes
      labels:
        - "*"
